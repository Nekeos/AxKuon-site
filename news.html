  /* Стилизация скроллбара браузера */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0c0c0f;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.3);
      border-radius: 5px;
      border: 2px solid #0c0c0f;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(167, 139, 250, 0.5);
    }

    /* Для Firefox */
    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(167, 139, 250, 0.3) #0c0c0f;
    }
    /* бурмалда */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* прогрев гоев */
    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    /* ссылки не трогать */
    a {

      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      -webkit-touch-callout: none;

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0c0c0f;
      color: #e0e0e0;
      line-height: 1.5;

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(12, 12, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 100;
      padding: 16px 0;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-decoration: none;
    }

    .logo span {
      color: #a78bfa;
    }

    .logo span:first-of-type {
      font-weight: inherit;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: #b0b0b0;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .btn-back {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #ccc;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back:hover {
      border-color: #a78bfa;
      color: #fff;
      background: rgba(167,139,250,0.1);
    }

    .page-header {
      padding: 60px 0 40px;
      text-align: center;
    }

    .page-header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-header p {
      color: #9090a0;
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 20px 0 60px;
    }

    .news-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 28px 32px;
      transition: all 0.25s ease;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .news-card:hover {
      border-color: rgba(167, 139, 250, 0.4);
      background: rgba(167, 139, 250, 0.04);
      transform: translateX(4px);
    }

    .news-date-badge {
      background: rgba(167, 139, 250, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      min-width: 70px;
      flex-shrink: 0;
    }

    .news-date-badge .day {
      font-size: 1.8rem;
      font-weight: 700;
      color: #c4b5fd;
      line-height: 1;
    }

    .news-date-badge .month {
      font-size: 0.85rem;
      color: #a78bfa;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .news-content {
      flex-grow: 1;
    }

    .news-category {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a78bfa;
      margin-bottom: 8px;
    }

    .news-card h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .news-card p {
      color: #a0a0b0;
      font-size: 0.95rem;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .news-link {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.2s;
    }

    .news-link:hover {
      gap: 10px;
    }

    .news-image {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      background: rgba(167, 139, 250, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 2.5rem;
      color: #a78bfa;
    }

    .pinned {
      border-color: rgba(167, 139, 250, 0.3);
      background: rgba(167, 139, 250, 0.05);
    }

    .pinned-badge {
      display: inline-block;
      background: #a78bfa;
      color: #0c0c0f;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-left: 8px;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .news-loading {

      padding: 40px 0;

    }

    footer {

    }

    @media (max-width: 420px) {
      .container { padding: 0 12px; }
    }
  </style>

  <main class="container">
    <div class="page-header">
      <h1>Новости</h1>
      <p>Анонсы, обновления, статьи и события из жизни AxKuon. Будьте в курсе всего.</p>
    </div>

    <div class="news-list" id="newsList">
      <div class="news-loading"><i class="fas fa-spinner fa-spin"></i> Загрузка новостей...</div>
    </div>

    <script>
    fetch('news.json')
      .then(r => {
        if (!r.ok) throw new Error('news.json не найден (ошибка ' + r.status + ')');
        return r.json();
      })
      .then(news => {
        // Сортируем: закреплённые первыми, потом по дате
        news.sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          return new Date(b.date) - new Date(a.date);
        });

        // Строим карточки
        document.getElementById('newsList').innerHTML = news.map(n => {
          const date = new Date(n.date);
          const months = ['Января','Февраля','Марта','Апреля','Мая','Июня','Июля','Августа','Сентября','Октября','Ноября','Декабря'];

          // Кнопка: если url пустой или не задан — не показываем
          // Подпись: если задан button — используем его, иначе «Читать»
          const buttonHtml = n.url
            ? `<a href="${n.url}" class="news-link">${n.button || 'Читать'} <i class="fas fa-arrow-right"></i></a>`
            : '';

          return `
            <div class="news-card ${n.pinned ? 'pinned' : ''}">
              <div class="news-date-badge">
                <div class="day">${date.getDate()}</div>
                <div class="month">${months[date.getMonth()]}</div>
              </div>
              <div class="news-content">
                <span class="news-category">${n.category}</span>
                <h2>${n.title}${n.pinned ? '<span class="pinned-badge">Закреплено</span>' : ''}</h2>
                <p>${n.description}</p>
                ${buttonHtml}
              </div>
              <div class="news-image">
                <i class="fas fa-${n.icon}"></i>
              </div>
            </div>
          `;
        }).join('');
      })
      .catch(e => {
        console.error('Ошибка загрузки новостей:', e);
        document.getElementById('newsList').innerHTML = 
          '<div class="news-loading">Не удалось загрузить новости: ' + e.message + '</div>';
      });
    </script>
  </main>

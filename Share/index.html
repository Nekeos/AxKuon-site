<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обмен файлами | AxKuon</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* Копируем базовые стили из твоего сайта */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #0c0c0f; }
    ::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.3); border-radius: 5px; border: 2px solid #0c0c0f; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(167, 139, 250, 0.5); }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #0c0c0f; color: #e0e0e0; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    body::before {
      content: ''; position: fixed; top: -50%; left: 50%; transform: translateX(-50%);
      width: 800px; height: 800px; background: radial-gradient(circle, rgba(167, 139, 250, 0.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    
    .container { max-width: 800px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; width: 100%; }
    
    header {
      position: sticky; top: 0; background-color: rgba(12, 12, 15, 0.85);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); z-index: 100; padding: 16px 0;
    }
    .nav-container { display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 0 auto; padding: 0 24px; }
    .logo { font-weight: 700; font-size: 1.8rem; letter-spacing: -0.5px; color: #ffffff; text-decoration: none; }
    .logo span { color: #a78bfa; }
    .nav-links a { color: #b0b0b0; text-decoration: none; font-weight: 500; font-size: 0.95rem; margin-left: 20px; transition: color 0.2s; }
    .nav-links a:hover { color: #ffffff; }
    
    .page-header { padding: 60px 0 32px; text-align: center; }
    .page-header h1 { font-size: 3rem; font-weight: 800; margin-bottom: 12px; background: linear-gradient(to right, #ffffff, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
    .page-header p { color: #9090a0; font-size: 1.1rem; }

    /* Сетка файлов */
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding-bottom: 60px; }
    
    .file-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 20px; padding: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;
    }
    .file-card:hover {
      border-color: rgba(167, 139, 250, 0.35); transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(167, 139, 250, 0.1);
    }
    
    .file-icon {
      width: 48px; height: 48px; border-radius: 12px; background: rgba(167, 139, 250, 0.15);
      display: flex; align-items: center; justify-content: center; color: #c4b5fd; font-size: 1.5rem;
      border: 1px solid rgba(167, 139, 250, 0.2);
    }
    
    .file-info { flex-grow: 1; }
    .file-name { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 4px; word-break: break-all; line-height: 1.3; }
    .file-meta { font-size: 0.85rem; color: #7c7c8a; display: flex; gap: 12px; flex-wrap: wrap; }
    
    .file-action {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 10px 16px; border-radius: 10px;
      background: rgba(167, 139, 250, 0.1); border: 1px solid rgba(167, 139, 250, 0.2); color: #c4b5fd;
      text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.3s;
    }
    .file-action:hover { background: rgba(167, 139, 250, 0.25); border-color: rgba(167, 139, 250, 0.5); color: #fff; }

    .empty-state { text-align: center; padding: 60px 20px; color: #7c7c8a; grid-column: 1 / -1; }
    .empty-state i { font-size: 3rem; color: #a78bfa; margin-bottom: 16px; display: block; }

    .site-footer {
      margin-top: auto; padding: 40px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); text-align: center; color: #6b6b7a; font-size: 0.9rem;
    }
    .site-footer a { color: #a78bfa; text-decoration: none; }
    
    @media (max-width: 768px) {
      .page-header h1 { font-size: 2.2rem; }
      .file-grid { grid-template-columns: 1fr; }
      .nav-container { flex-direction: column; gap: 12px; }
      .nav-links a { margin: 0 10px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="../index.html" class="logo">Ax<span>Kuon</span></a>
      <div class="nav-links">
        <a href="../index.html">Главная</a>
        <a href="../releases.html">Релизы</a>
        <a href="../news.html">Новости</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Обмен файлами</h1>
      <p>Быстрая передача файлов напарникам. Просто, без регистрации и лишних телодвижений.</p>
    </div>

    <div class="file-grid" id="fileGrid">
      <!-- Сюда будут вставляться карточки файлов -->
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 <a href="../index.html">AxKuon.ru</a> — приложения для Android, Linux и Windows.</p>
  </footer>

  <script>
    // Автоматическая загрузка списка файлов из files.json
    fetch('files.json')
      .then(res => {
        if (!res.ok) throw new Error('Не удалось загрузить список файлов (files.json)');
        return res.json();
      })
      .then(files => {
        renderFiles(files);
      })
      .catch(err => {
        document.getElementById('fileGrid').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Ошибка: ${err.message}</p>
            <p style="font-size: 0.85rem; margin-top: 8px;">Убедитесь, что файл files.json существует в папке Share/</p>
          </div>
        `;
      });

    function renderFiles(files) {
      const grid = document.getElementById('fileGrid');
      
      if (!files || files.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-folder-open"></i>
            <p>Пока нет доступных файлов</p>
          </div>
        `;
        return;
      }

      // Сортируем по дате (новые сверху)
      files.sort((a, b) => new Date(b.date) - new Date(a.date));

      grid.innerHTML = files.map(file => {
        // Определяем иконку по расширению
        const ext = (file.name || '').split('.').pop().toLowerCase();
        let icon = 'fa-file';
        if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) icon = 'fa-file-archive';
        else if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) icon = 'fa-file-image';
        else if (['mp4', 'mkv', 'avi', 'mov'].includes(ext)) icon = 'fa-file-video';
        else if (['mp3', 'wav', 'ogg', 'flac'].includes(ext)) icon = 'fa-file-audio';
        else if (['pdf'].includes(ext)) icon = 'fa-file-pdf';
        else if (['doc', 'docx'].includes(ext)) icon = 'fa-file-word';
        else if (['xls', 'xlsx'].includes(ext)) icon = 'fa-file-excel';
        else if (['js', 'ts', 'html', 'css', 'py', 'php', 'json', 'md'].includes(ext)) icon = 'fa-file-code';
        else if (['exe', 'msi', 'apk'].includes(ext)) icon = 'fa-file-download';

        // Форматируем размер
        let sizeStr = 'Неизвестно';
        if (file.size) {
          if (file.size < 1024) sizeStr = file.size + ' Б';
          else if (file.size < 1024 * 1024) sizeStr = (file.size / 1024).toFixed(1) + ' КБ';
          else sizeStr = (file.size / (1024 * 1024)).toFixed(1) + ' МБ';
        }

        // Дата
        const dateStr = file.date ? new Date(file.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

        return `
          <div class="file-card">
            <div class="file-icon"><i class="fas ${icon}"></i></div>
            <div class="file-info">
              <div class="file-name">${escapeHtml(file.name)}</div>
              <div class="file-meta">
                <span>${sizeStr}</span>
                ${dateStr ? `<span>${dateStr}</span>` : ''}
              </div>
            </div>
            <a href="${file.url || file.name}" class="file-action" download>
              <i class="fas fa-download"></i> Скачать
            </a>
          </div>
        `;
      }).join('');
    }

    // Защита от XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
